name: CI backend

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: |
          # If package.json exposes a lint script, run it. Otherwise try eslint if present.
          if npm run | grep -q "lint"; then
            npm run lint
          elif [ -f .eslintrc.js ] || [ -f .eslintrc.json ] || [ -f .eslintrc ]; then
            npx eslint . || true
          else
            echo "No lint script or ESLint config found; skipping lint."
          fi

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Docker build
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false