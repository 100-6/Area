name: Build and Deploy Mirror-Area

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - '.github/workflows/deploy.yaml'

env:
  REGISTRY: registry.eliasdrissi.dev
  BACKEND_IMAGE: area-backend
  FRONTEND_IMAGE: area-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CA certificate
        run: |
          echo -n | openssl s_client -connect registry.eliasdrissi.dev:443 -servername registry.eliasdrissi.dev 2>/dev/null | openssl x509 > /tmp/registry-ca.crt
          sudo mkdir -p /usr/local/share/ca-certificates/
          sudo cp /tmp/registry-ca.crt /usr/local/share/ca-certificates/registry-eliasdrissi-dev.crt
          sudo update-ca-certificates
          sudo mkdir -p /etc/docker/certs.d/registry.eliasdrissi.dev
          sudo cp /tmp/registry-ca.crt /etc/docker/certs.d/registry.eliasdrissi.dev/ca.crt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."registry.eliasdrissi.dev"]
              ca=["/etc/docker/certs.d/registry.eliasdrissi.dev/ca.crt"]

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          # Generate tags: latest, date-sha
          DATE=$(date +%Y%m%d)
          SHA=${GITHUB_SHA::7}
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "backend_tags=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest,${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${DATE}-${SHA}" >> $GITHUB_OUTPUT
          echo "frontend_tags=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest,${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${DATE}-${SHA}" >> $GITHUB_OUTPUT

      # ==========================================
      # BUILD MOBILE APK
      # ==========================================
      - name: Setup Java for Flutter
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Build Flutter APK
        working-directory: ./mobile
        run: |
          flutter pub get
          flutter build apk --release
          echo "✅ APK built successfully"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare APK for Docker build
        run: |
          mkdir -p backend/public
          cp mobile/build/app/outputs/flutter-apk/app-release.apk backend/public/app.apk
          echo "✅ APK copied to backend/public/"
          ls -lh backend/public/app.apk

      # ==========================================
      # BUILD & PUSH BACKEND
      # ==========================================
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: false
          sbom: false

      # ==========================================
      # BUILD & PUSH FRONTEND
      # ==========================================
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          build-args: |
            NUXT_PUBLIC_API_URL=https://auto.eliasdrissi.dev
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ==========================================
      # SECURITY SCANS
      # ==========================================
      - name: Run Trivy scan on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Run Trivy scan on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

      # ==========================================
      # DEPLOYMENT NOTIFICATION
      # ==========================================
      - name: Notify deployment
        if: success()
        run: |
          echo "=========================================="
          echo "✅ Mirror-Area Images pushed successfully!"
          echo "=========================================="
          echo ""
          echo " Backend tags:"
          echo "   - ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest"
          echo "   - ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}"
          echo ""
          echo " Frontend tags:"
          echo "   - ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest"
          echo "   - ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}"
          echo ""
          echo " Security scans completed"
          echo " Watchtower will detect and deploy in ~5 minutes"
          echo "=========================================="
