  #     - pgadmin_data:/var/lib/pgladmin
  #   networks:
  #     - area_network
  #   depends_on:
  #     postgres_db:
  #       condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # pgadmin_data:
  #   driver: local

networks:
  area_network:
    driver: bridge
